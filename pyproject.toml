[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "debreak"
version = "1.3"
description = "SV caller for long-read single-molecule sequencing data"
readme = "README.md"
license = { file = "LICENSE.txt" }
authors = [{ name = "Maggi Chen" }]
requires-python = ">=3.8"
dependencies = ["pysam"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: POSIX :: Linux",
]

# External (non-Python) tools, not installable via pip:
#   minimap2  - --rescue_dup, --rescue_large_ins, --poa
#   wtdbg2    - --rescue_large_ins
#   bsalign   - --poa

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]
mutation = ["mutmut>=3.8,<4"]

[project.urls]
Homepage = "https://github.com/Maggi-Chen/DeBreak"

[tool.setuptools]
# Flat layout: top-level modules imported by the `debreak` script.
py-modules = [
    "debreak_detect",
    "debreak_merge",
    "debreak_merge_contig",
    "debreak_merge_cluster",
    "debreak_genotype",
    "debreak_writevcf",
    "debreak_allpoa",
    "debreak_rescuedupfromins",
    "debreak_rescuelargeins",
    "debreak_resdup_selfalignment",
    "debreak_lowmem",
    "complexsv",
    "genefusion",
]
# `debreak` has no main() yet, so it is installed as-is (same as the bioconda
# recipe). After the refactor replace this with:
#   [project.scripts]
#   debreak = "debreak_cli:main"
script-files = ["debreak"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# E2E tests run `debreak` in a subprocess, which forks multiprocessing workers;
# measure all of them, not only the pytest process.
patch = ["subprocess"]
concurrency = ["multiprocessing"]
parallel = true
# Workers re-read this file from their own CWD (E2E tests run debreak from
# testdata/tra or tmp dirs), so paths must not be CWD-relative. DEBREAK_REPO
# is set by tests/conftest.py; "." is the fallback for the pytest process.
source = ["${DEBREAK_REPO-.}"]
data_file = "${DEBREAK_REPO-.}/.coverage"
omit = ["*/tests/*", "*/.venv/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.mutmut]
# Mutation testing (`mutmut run`, results: `mutmut results` / `mutmut browse`).
# Only modules with unit tests; E2E tests are excluded because they run the
# pipeline in a subprocess per test, which is too slow per mutant.
source_paths = [
    "debreak_detect.py",
    "debreak_merge_cluster.py",
    "debreak_merge_contig.py",
    "debreak_genotype.py",
]
mutate_only_covered_lines = true
also_copy = ["testdata", "debreak"]
pytest_add_cli_args_test_selection = [
    "tests/test_detect.py",
    "tests/test_merge_genotype.py",
    "tests/test_genotype_boundaries.py",
]
